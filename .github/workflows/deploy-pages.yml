name: Preview and publish Nerve Lab website

on:
  push:
    branches: [main, published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview source (main)
        uses: actions/checkout@v7
        with:
          ref: main
          path: preview-src

      - name: Check out approved live source (published)
        uses: actions/checkout@v7
        with:
          ref: published
          path: published-src

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: preview-src/package-lock.json

      - name: Install and test preview
        working-directory: preview-src
        run: |
          npm ci
          npm test

      - name: Build preview
        working-directory: preview-src
        run: npm run build

      - name: Install and test approved live version
        working-directory: published-src
        run: |
          npm ci
          npm test

      - name: Build approved live version
        working-directory: published-src
        run: npm run build

      - name: Assemble live site and preview subdirectory
        run: |
          mkdir -p site/preview
          cp -a published-src/dist/. site/
          cp -a preview-src/dist/. site/preview/
          # The preview is publicly accessible but should not appear in search.
          python3 - <<'PY'
          from pathlib import Path
          index = Path("site/preview/index.html")
          source = index.read_text()
          old = '<meta name="robots" content="index, follow" />'
          assert old in source, "Preview robots tag not found"
          index.write_text(source.replace(old, '<meta name="robots" content="noindex, nofollow" />'))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload combined website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy approved website with preview
        id: deployment
        uses: actions/deploy-pages@v5
